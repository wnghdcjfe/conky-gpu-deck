-- conky-gpu-deck: clock and per-GPU telemetry for NVIDIA workstations.
-- Runs on plain conky-std; no Lua/Cairo build is required.

local function theme_dir()
  local source = debug.getinfo(1, 'S').source:gsub('^@', '')
  local dir = source:match('^(.*)/[^/]*$') or '.'
  if dir:sub(1, 1) ~= '/' then
    dir = (os.getenv('PWD') or '.') .. '/' .. dir
  end
  return dir
end

-- GPU_DECK_SCALE overrides the resolution-based default.
local function detect_scale()
  local override = tonumber(os.getenv('GPU_DECK_SCALE') or '')
  if override and override > 0 then return override end

  local pipe = io.popen('xrandr --current 2>/dev/null')
  if not pipe then return 1 end
  local output = pipe:read('*a') or ''
  pipe:close()

  local width, height = output:match(' connected primary (%d+)x(%d+)')
  if not width then width, height = output:match(' connected (%d+)x(%d+)') end
  -- The short edge keeps rotated monitors on the same scale as landscape ones.
  local short_edge = math.min(tonumber(width) or 1080, tonumber(height) or 1080)
  if short_edge >= 2160 then return 1.6 end
  if short_edge >= 1440 then return 1.25 end
  return 1
end

local scale = detect_scale()
local function px(value) return math.floor(value * scale + 0.5) end
-- Pixel sizes keep text inside the fixed-width window at any Xft DPI.
local function font_px(size) return math.floor(size * scale * 96 / 72 + 0.5) end
local function font(size, style)
  return 'JetBrains Mono,DejaVu Sans Mono,Noto Sans CJK KR:'
    .. (style and (style .. ':') or '') .. 'pixelsize=' .. font_px(size)
end

local panel = theme_dir() .. '/scripts/gpu-panel.sh'
-- Conky ends a variable at the first closing brace, even inside shell quotes.
if panel:find('[{}]') then
  error('gpu-deck: theme path must not contain { or }')
end
-- Conky strips a leading quote from exec commands, so the command must not start with one.
local panel_cmd = "exec '" .. panel:gsub("'", "'\\''") .. "'"

conky.config = {
  background = true,
  update_interval = 1,
  double_buffer = true,
  no_buffers = true,
  cpu_avg_samples = 2,
  net_avg_samples = 2,
  text_buffer_size = 32768,
  max_user_text = 65536,
  override_utf8_locale = true,
  use_xft = true,

  own_window = true,
  own_window_class = 'Conky',
  own_window_title = 'conky-gpu-deck',
  own_window_type = 'normal',
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  own_window_transparent = false,
  own_window_argb_visual = true,
  own_window_argb_value = 215,
  own_window_colour = '0d1117',

  alignment = 'top_right',
  gap_x = px(24),
  gap_y = px(48),
  minimum_width = px(430),
  maximum_width = px(430),
  border_inner_margin = px(16),
  border_outer_margin = 0,
  draw_borders = false,
  draw_outline = false,
  draw_shades = false,
  draw_graph_borders = false,

  font = font(10),
  font0 = font(10),
  font1 = font(36, 'bold'),
  font2 = font(14),
  font3 = font(11, 'bold'),
  -- Xft does not fall back per glyph, so localized weekdays need a CJK-capable font.
  font4 = 'Noto Sans CJK KR,DejaVu Sans:pixelsize=' .. font_px(14),

  default_color = 'e6edf3',
  color1 = '58a6ff', -- accent
  color2 = '3fb950', -- normal
  color3 = 'd29922', -- warning
  color4 = 'f85149', -- critical
  color5 = '8b949e', -- muted
  color6 = '30363d', -- bar track
}

conky.text = [[
${font1}${color}${time %H:%M}${font2}${color5} ${time %S}${alignr}${font4}${time %a}
${font0}${color5}${time %Y-%m-%d}${alignr}${color5}up ${color1}${uptime_short}
${color6}${hr 1}
${execpi 2 ]] .. panel_cmd .. ' ' .. px(8) .. [[}
${font0}${color6}${hr 1}
${color5}CPU ${color}${cpu cpu0}%${alignr}${color5}RAM ${color}${mem} / ${memmax}
]]
